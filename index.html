<!DOCTYPE html>
<html lang="en">
<head>
   <meta name="google-site-verification" content="tuvLa3Nvu62x-f6_DLx0UEV7fUsyeKsJa5kX8QhL_WQ" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skippers Arcade - Official Site</title>
    <link rel="icon" type="image/png" href="https://www.datocms-assets.com/129288/1734105343-homepage_header.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
    <nav class="arcade-navbar">
        <a href="index.html" class="nav-brand">Skipper's Arcade</a>
        <div class="nav-links" id="navbar-games">
            <!-- JavaScript will automatically fill this with your games -->
        </div>
    </nav>
</header>


    <!-- Main Content Container -->
    <main>
    <section id="my-games">
        <h1 id="anim">Skipper's Arcade</h1>
         <hr>
            <br>
            <p style="text-align: center;">Penguins, penguins, penguins! Ever thought a website just all about penguins?
            Well, this is the place to explore all things penguin-related ~ish..
            </p>

        <h2>Featured Games</h2>

        <!-- This is the empty box that JavaScript will automatically fill up with games -->
        <div class="game-container" id="homepage-games-grid"></div>
    </section>
</main>

<!-- Place this script at the bottom of index.html, right before the closing </body> tag -->
    <!-- Load the shared master list first -->
<script src="games.js"></script>

<!-- Then build the homepage cards -->
<script>
    const homeGrid = document.getElementById('homepage-games-grid');
    
    if (homeGrid) {
        masterGamesList.forEach(game => {
            const gameLink = document.createElement('a');
            gameLink.href = `webdashers.html?game=${encodeURIComponent(game.url)}`;
            gameLink.style.textDecoration = "none";
            gameLink.style.color = "inherit";

            gameLink.innerHTML = `
                <div class="game-card">
                    <img src="${game.image}" alt="${game.name} Cover" class="game-image">
                    <div class="game-overlay">
                        <h3 class="game-title">${game.name}</h3>
                    </div>
                </div>
            `;
            homeGrid.appendChild(gameLink);
        });
    }
</script>


    <!-- Footer -->
    <footer>
        <p class="Copyright">&copy; 2026 Skipper's Arcade. All rights reserved.</p>
    </footer>

</body>
</html>
