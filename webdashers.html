<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://www.datocms-assets.com/129288/1734105343-homepage_header.png">
    <title>Web Dashers Arcade Portal</title>
    
</head>
<body>
    <header>
    <nav class="arcade-navbar">
        <a href="index.html" class="nav-brand">Skipper's Arcade</a>
        <div class="nav-links" id="navbar-games">
            <!-- JavaScript will automatically fill this with your games -->
        </div>
    </nav>
</header>

    <!-- Top Navigation Header -->
    <header>
    <nav class="arcade-navbar">
        <a href="index.html" class="nav-brand">← Back to Hub</a>
        <div class="nav-links" id="navbar-games"></div>
    </nav>
</header>


    <!-- Updated Arcade Layout -->
        <div class="arcade-layout">

        <!-- Empty Spacer on the Left (Balances the right sidebar so the game stays dead-center) -->
        <div class="left-spacer"></div>

               <!-- Center Game Stage -->
        <div class="game-stage" id="main-stage">
            <div class="game-frame-container" id="frame-container">
                <!-- GTA-Style Loading Overlay -->
                <div class="gta-loader" id="gta-loader">
                    <img src="loading1.png" alt="Loading Art" class="gta-bg-img" id="gta-bg-img">
                    <div class="gta-vignette"></div>

                    <div class="gta-secret-tag" id="gta-secret-tag">★ SECRET LOADING SCREEN ★</div>

                    <div class="gta-bottom-hud">
                        <div class="gta-tip-box">
                            <span class="gta-game-label" id="gta-game-label">LOADING GAME...</span>
                            <p class="gta-tip-text" id="gta-tip-text">Pro Tip: Use Theater Mode for a wider view!</p>
                        </div>
                        <div class="gta-bar-track">
                            <div class="gta-bar-fill" id="gta-bar-fill"></div>
                        </div>
                    </div>
                </div>

                <iframe src="" id="game-iframe" allow="fullscreen" allowfullscreen></iframe>
            </div>

            <div class="controls-panel">
                <button class="control-btn" id="theater-toggle">Theater Mode</button>
                <button class="control-btn" id="fullscreen-toggle">Fullscreen</button>
            </div>
        </div>

        <!-- Single Right Sidebar with All Games -->
        <div class="sidebar right" id="right-sidebar-grid">
            <h3>All games</h3>
        </div>

    </div>


   
        <!-- Load the shared master list first -->
<script src="games.js"></script>

<!-- Then build the sidebars and player controls -->
    <script src="games.js"></script>
    <script>
        const rightSidebar = document.getElementById('right-sidebar-grid');
        const mainIframe = document.getElementById('game-iframe');

        // Put EVERY game into the single right sidebar
        masterGamesList.forEach(game => {
            const miniCard = document.createElement('div');
            miniCard.className = "mini-card";
            miniCard.onclick = () => launchGame(game.url);
            miniCard.innerHTML = `
                <img src="${game.image}" alt="${game.name} Cover" class="mini-game-image">
                <div class="mini-overlay">
                    <span class="mini-title">${game.name}</span>
                </div>
            `;
            rightSidebar.appendChild(miniCard);
        });

                // ==========================================
        // GTA LOADING SCREEN SETTINGS (EDIT IMAGES HERE)
        // ==========================================
        const normalLoadingPics = [
            "loading1.png",
            "loading2.png",
        ];
        const secretLoadingPic = "secret-loading.png";
        const secretChance = 0.0; // 0% chance to trigger the secret loading screen (raise the .0 higher to increase the chance)

        const loadingTips = [
            "TIP: Press the Fullscreen button below for the best experience.",
            "TIP: Found a broken game? Report it in the Suggestions & Bugs tab",
            "TIP: Check the top Updates bar for newly added games.",
            "TIP: Use Theater Mode to hide the sidebar while playing."
        ];

        const gtaLoader = document.getElementById('gta-loader');
        const gtaBgImg = document.getElementById('gta-bg-img');
        const gtaSecretTag = document.getElementById('gta-secret-tag');
        const gtaGameLabel = document.getElementById('gta-game-label');
        const gtaTipText = document.getElementById('gta-tip-text');
        const gtaBarFill = document.getElementById('gta-bar-fill');

        let loadTimer = null;

        function playGtaLoadingScreen(gameName) {
            clearTimeout(loadTimer);

            // Reset progress bar and show loader
            gtaLoader.classList.remove('fade-out');
            gtaLoader.style.display = 'flex';
            gtaBarFill.style.transition = 'none';
            gtaBarFill.style.width = '0%';

            // Restart the slow GTA camera pan/zoom animation
            gtaBgImg.classList.remove('ken-burns');
            void gtaBgImg.offsetWidth; // Forces browser to restart animation
            gtaBgImg.classList.add('ken-burns');

            // Roll the dice for the Secret Loading Screen!
            const isSecret = Math.random() < secretChance;
            if (isSecret) {
                gtaBgImg.src = secretLoadingPic;
                gtaSecretTag.style.display = 'block';
                gtaTipText.textContent = "🔥 RARE SCREEN UNLOCKED: You found the secret loading screen!";
            } else {
                const randomPic = normalLoadingPics[Math.floor(Math.random() * normalLoadingPics.length)];
                gtaBgImg.src = randomPic;
                gtaSecretTag.style.display = 'none';
                gtaTipText.textContent = loadingTips[Math.floor(Math.random() * loadingTips.length)];
            }

            gtaGameLabel.textContent = gameName ? `LOADING ${gameName.toUpperCase()}...` : "LOADING ARCADE...";

            // Animate progress bar smoothly over 4.6 seconds
            requestAnimationFrame(() => {
                gtaBarFill.style.transition = 'width 4.6s cubic-bezier(0.22, 1, 0.36, 1)';
                gtaBarFill.style.width = '100%';
            });

            // Fade out the loading screen once the bar finishes
            loadTimer = setTimeout(() => {
                gtaLoader.classList.add('fade-out');
                setTimeout(() => {
                    gtaLoader.style.display = 'none';
                }, 600);
            }, 5000);
        }

        function launchGame(gameUrl, gameName = "") {
            // Find the game's display name from masterGamesList if not passed directly
            if (!gameName && typeof masterGamesList !== 'undefined') {
                const found = masterGamesList.find(g => g.url === gameUrl);
                if (found) gameName = found.name;
            }
            playGtaLoadingScreen(gameName);
            mainIframe.src = gameUrl;
        }
        // Trigger the loading screen as soon as a player opens any game page
        const urlParameters = new URLSearchParams(window.location.search);
        const targetGameUrl = urlParameters.get('game');
        if (targetGameUrl) {
            launchGame(targetGameUrl);
        } else {
            launchGame("https://github.io", "Web Dashers");
        }
        // End of gta loading screen logic


        const theaterBtn = document.getElementById('theater-toggle');
        const fullscreenBtn = document.getElementById('fullscreen-toggle');
        const rightRail = document.getElementById('right-sidebar-grid');
        const leftSpacer = document.querySelector('.left-spacer');
        const frameContainer = document.getElementById('frame-container');

        theaterBtn.addEventListener('click', () => {
            rightRail.classList.toggle('hide-sidebar');
            if (leftSpacer) leftSpacer.classList.toggle('hide-sidebar');
            frameContainer.classList.toggle('theater-grow');
            theaterBtn.textContent = frameContainer.classList.contains('theater-grow') ? 'Normal View' : 'Theater Mode';
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                frameContainer.requestFullscreen().catch(err => alert(`Fullscreen error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        });
    </script>

</body>
</html>
