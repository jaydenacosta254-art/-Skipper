<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skipper's Arcade</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Your CSS styling will go here later */
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            font-family: Arial, sans-serif, cursive;
            margin: 0;
            padding: 10px;
            color:white;
        }

    .Copyright {
        opacity: 0.8;
        text-align: center;
        font-size: 10px;
        display: block;
    }
    #anim{
         text-align: center;
        animation: rgbRainbow 6s linear infinite;
}
   .section-subtitle {
    text-align: center;
    font-size: 24px;
    margin-top: 20px;
}

.game-container {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.game-card {
    position: relative;
    width: 300px;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    cursor: pointer;
}

.game-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.game-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Creates the black fade overlay from bottom to top */
    background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0) 100%);
    display: flex;
    align-items: flex-end; 
    padding: 20px;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.game-title {
    color: #ffffff;
    font-size: 22px;
    margin: 0;
}

/* Fades the card overlay to black on hover */
.game-card:hover .game-overlay {
    opacity: 1;
}

@keyframes rgbRainbow {
  0%, 100% { color: rgb(255, 0, 0); }
  17% { color: rgb(255, 165, 0); }
  33% { color: rgb(255, 255, 0); }
  50% { color: rgb(0, 128, 0); }
  67% { color: rgb(0, 0, 255); }
  83% { color: rgb(75, 0, 130); }
 
    }
    /* Locks the size of the sidebar mini-cards */
.mini-card {
    position: relative;
    width: 100%;
    height: 110px; /* Change this number to make sidebar thumbnails taller or shorter */
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #2e2e38;
    cursor: pointer;
    background-color: #1e1e24;
    transition: all 0.25s ease;
}

/* Scales sidebar images properly */
.mini-game-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}
    /* Top Navigation Bar */
.arcade-navbar {
    background-color: #1a1a1f;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #292933;
    position: sticky;
    top: 0;
    z-index: 1000;
}

/* Website Logo / Home Link */
.nav-brand {
    color: #4fc3f7;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;
    white-space: nowrap;
    margin-right: 20px;
}

/* Container for the game links */
.nav-links {
    display: flex;
    gap: 10px;
    overflow-x: auto; /* Lets users scroll sideways if you add lots of games */
    padding-bottom: 2px;
}

/* Individual Game Buttons */
.nav-item {
    color: #e0e0e0;
    background-color: #25252d;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #32323e;
    white-space: nowrap;
    transition: all 0.2s ease;
}

.nav-item:hover {
    background-color: #4fc3f7;
    color: #121214;
    border-color: #4fc3f7;
}

    </style>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
    <nav class="arcade-navbar">
        <a href="index.html" class="nav-brand">Skipper's Arcade</a>
        <div class="nav-links" id="navbar-games">
            <!-- JavaScript will automatically fill this with your games -->
        </div>
    </nav>
</header>


    <!-- Main Content Container -->
    <main>
    <section id="my-games">
        <h1 id="anim">Skipper's Arcade</h1>
         <hr>
            <br>
            <p style="text-align: center;">Penguins, penguins, penguins! Ever thought a website just all about penguins?
            Well, this is the place to explore all things penguin-related ~ish..
            </p>

        <h2>Featured Games</h2>

        <!-- This is the empty box that JavaScript will automatically fill up with games -->
        <div class="game-container" id="homepage-games-grid"></div>
    </section>
</main>

<!-- Place this script at the bottom of index.html, right before the closing </body> tag -->
    <!-- Load the shared master list first -->
<script src="games.js"></script>

<!-- Then build the homepage cards -->
<script>
    const homeGrid = document.getElementById('homepage-games-grid');
    
    if (homeGrid) {
        masterGamesList.forEach(game => {
            const gameLink = document.createElement('a');
            gameLink.href = `webdashers.html?game=${encodeURIComponent(game.url)}`;
            gameLink.style.textDecoration = "none";
            gameLink.style.color = "inherit";

            gameLink.innerHTML = `
                <div class="game-card">
                    <img src="${game.image}" alt="${game.name} Cover" class="game-image">
                    <div class="game-overlay">
                        <h3 class="game-title">${game.name}</h3>
                    </div>
                </div>
            `;
            homeGrid.appendChild(gameLink);
        });
    }
</script>


    <!-- Footer -->
    <footer>
        <p class="Copyright">&copy; 2026 Skipper's Arcade. All rights reserved.</p>
    </footer>

</body>
</html>
